{% extends "base.html" %}
{% block contenido %}


<form method="POST" action="{{ url_for('calculadorapesoideal') }}">
<h2 class="text-center">Calculadora Peso Ideal</h2>
<div class="container" style="background-color: #b8e994;">
    <div class="mb-3">
        <label for="altura" class="form-label">Altura (cm)</label>
        <input type="number" step="0.1" name="altura" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Sexo:</label>
        <select name="sexo" class="form-control" required>
            <option value="hombre">Hombre</option>
            <option value="mujer">Mujer</option>
        </select>
    </div>
    <div class="container">
    <button type="submit" class="btn btn-primary w-100">Calcular</button>
    </div>
</form>
</div> 

{% if resultado %}
    <div class="alert alert-success mt-3">
        Tu peso ideal es: <strong>{{ resultado }}</strong> kg
    </div>
{% endif %}

{% endblock %}
