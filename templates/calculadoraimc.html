{% extends "base.html" %}
{% block contenido %}


<h2 class="text-center">Calculadora IMC</h2>
<div class="container" style="background-color: #b8e994;">
<form method="POST" action="{{ url_for('calculadoraimc')}}">
    <div class="mb-3">
        <label for="peso" class="form-label">Peso (kg)</label> 
        <input type="number" name="peso" step="0.1" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="altura" class="form-label">Altura (cm)</label>
        <input type="number" step="0.1" name="altura" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary w-100">Calcular</button> 
</form>
</div>

{% if resultado %}
    <h3>Tu IMC es: {{ resultado }}</h3>
{% endif %}

{% endblock %}
