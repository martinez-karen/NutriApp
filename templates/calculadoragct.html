{% extends "base.html" %}
{% block contenido %}

<h2>Calculadora Gasto Calorico Totaal (GCTT)</h2>
<form method="POST" action="{{ url_for('calculadoragct') }}">
    <div class="mb-3">
        <label>TMB (cal/dia)</label>
        <input type="number" step="0.1" name="tmb" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Nivel de actividadess</label>
        <select name="actividad" class="form-select" required>
            <option value="1.2">Sedentario</option>
            <option value="1,375">Ligera</option>
            <option value="1.55">Moderada</option>
            <option value="1.725">Intensa</option>
            <option value="1.9">Muy intensa</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary w-100">Calcular</button>
</form>

{% if resultado %}
    <div class="alert alert-success mt-3">
        Tu gasto calorico total es: <strong>{{ resultado }}</strong>
    </div>


{% endif %}

{% endblock %}
