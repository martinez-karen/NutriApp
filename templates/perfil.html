{% extends "base.html" %}

{% block contenido %}
<h1 class="text-center">Perfil Detallado</h1>

{% with mensajes = get_flashed_messages() %}
  {% if mensajes %}
    <div class="alert alert-success text-center mt-3">
      {% for mensaje in mensajes %}
        {{ mensaje }}
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

<div class="container mt-4 d-flex justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">

    <form class="p-4 bg-light rounded shadow-sm" method="POST" action="{{ url_for('perfil') }}">
      <h2 class="text-center mb-4">Perfil del Usuario</h2>

      <div class="p-3 rounded mb-3" style="background-color: #b8e994;">

        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ingresa tu nombre" required>
        </div>

        <div class="mb-3">
          <label for="edad" class="form-label">Edad</label>
          <input type="number" id="edad" name="edad" class="form-control" placeholder="Ingresa tu edad" required>
        </div>

        <div class="mb-3">
          <label for="sexo" class="form-label">Sexo</label>
          <select id="sexo" name="sexo" class="form-select" required>
            <option value="" selected disabled>Selecciona una opción</option>
            <option value="Femenino">Femenino</option>
            <option value="Masculino">Masculino</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="peso" class="form-label">Peso (kg)</label>
          <input type="number" step="0.1" id="peso" name="peso" class="form-control" placeholder="Ingresa tu peso" required>
        </div>

        <div class="mb-3">
          <label for="altura" class="form-label">Altura (cm)</label>
          <input type="number" step="0.1" id="altura" name="altura" class="form-control" placeholder="Ingresa tu altura" required>
        </div>

        <div class="mb-3">
          <label for="text" class="form-label">¿Eres principiante?</label>
          <select id="text" name="text" class="form-select" required>
            <option value="" selected disabled>Selecciona una opción</option>
            <option value="Si">Si</option>
            <option value="No">No</option>
            <option value="Tengo conocimientos">Tengo conocimientos</option>
          </select>
        </div>

        <div class="mb-3">
          <h5>¿Qué estás buscando?</h5>
          <div class="d-flex flex-column">
            <label><input type="checkbox" name="busqueda" class="busqueda"> Contador de calorías</label>
            <label><input type="checkbox" name="busqueda" class="busqueda"> Control de peso</label>
            <label><input type="checkbox" name="busqueda" class="busqueda"> Control de agua</label>
            <label><input type="checkbox" name="busqueda" class="busqueda"> Ejercicio</label>
            <label><input type="checkbox" name="busqueda" class="busqueda"> Alimentación</label>
          </div>
        </div>

      </div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary w-100">Guardar Perfil</button>
      </div>

    </form>

  </div>
</div>

{% endblock %}
