{% extends "base.html" %}
{% block contenido %}

<h2 class="text-center">Calculadora de Macronutrientes</h2>
<div class="container" style="background-color: #b8e994;">
<form method="POST" action="{{ url_for('macronutrientes') }}">

    <div class="mb-3">
        <label class="form-label">Calorías diarias:</label>
        <input type="number" name="calorias" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Proteína (%)</label>
        <input type="number" name="prot" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Carbohidratos (%)</label>
        <input type="number" name="carbs" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Grasas (%)</label>
        <input type="number" name="grasas" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary">Calcular</button>
</form>
</div>

{% if resultado %}
<div class="alert alert-info mt-3">
    <h4>Resultados:</h4>
    <p><strong>Proteína:</strong> {{ resultado.proteina }} g</p>
    <p><strong>Carbohidratos:</strong> {{ resultado.carbs }} g</p>
    <p><strong>Grasas:</strong> {{ resultado.grasas }} g</p>
</div>
{% endif %}

{% endblock %}
