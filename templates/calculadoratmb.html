{% extends "base.html" %}
{% block contenido %}

<h2>Calculadora TMBB</h2>

<form method="POST" action="{{ url_for('calculadoratmb') }}">
    <div class="mb-3">
        <label for="altura" class="form-label">Altura (cm)</label>
        <input type="number" step="0.1" name="altura" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="peso" class="form-label">Peso (kg)</label> 
        <input type="number" name="peso" step="0.1" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="edad" class="form-label">Edad</label> 
        <input type="number" name="edad" step="1" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Sexo:</label>
        <select name="sexo" class="form-select" required>
            <option value="hombre">Hombre</option>
            <option value="mujer">Mujer</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary w-100">Calcular</button>
</form>

{% if resultado %}
    <div class="alert alert-success mt-3">
        Tu TMB es: <strong>{{ resultado }}</strong> calorías/día
    </div>
{% endif %}

{% endblock %}
